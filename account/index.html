<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Malik Store Account</title>

<style>
@font-face{
    font-family:Malik;
    src:url("../assets/font/font.ttf");
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:
    linear-gradient(rgba(3,8,20,.78),rgba(3,8,20,.92)),
    url("../assets/image/login-bg.jpg");
    background-size:cover;
    background-position:center;
    color:white;
    font-family:Malik,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth-box{
    width:100%;
    max-width:390px;
    padding:35px 28px;
    border-radius:22px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(0,255,255,.35);
    box-shadow:0 0 40px rgba(0,200,255,.25);
}

.brand{
    text-align:center;
}

.brand h1{
    margin:0;
    font-size:34px;
    letter-spacing:2px;
}

.brand span{
    color:#00ff66;
}

.brand p{
    color:#b8c1d1;
    letter-spacing:3px;
    font-size:13px;
}

.page-title{
    text-align:center;
    margin:35px 0 20px;
}

.field{
    margin-bottom:18px;
}

.field label{
    display:block;
    margin-bottom:8px;
    color:#d8d8d8;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.35);
    color:white;
    outline:none;
}

input:focus{
    border-color:#00ff66;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#00ff66,#00d9ff);
    font-weight:bold;
    cursor:pointer;
}

.link{
    text-align:center;
    margin-top:22px;
    color:#ddd;
}

a{
    color:#00ff66;
}

.hide{
    display:none;
}

.auth-box.checking{
    visibility:hidden;
}

.msg{
    min-height:18px;
    margin:0;
    color:#ff6b6b;
    font-size:13px;
    text-align:center;
}
</style>
</head>

<body>

<div class="auth-box checking" id="auth-box">

<div class="brand">
<h1>MALIK<span>STORE</span></h1>
<p>DIGITAL SERVICE HUB</p>
</div>


<div id="login">
<h2 class="page-title">Masuk Akun</h2>

<div class="field">
<label>Email</label>
<input id="login-email" type="email" placeholder="email@gmail.com" autocomplete="email">
</div>

<div class="field">
<label>Password</label>
<input id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
</div>

<p id="auth-msg" class="msg" role="alert"></p>
<pre id="auth-debug" class="hide" style="white-space:pre-wrap;word-break:break-all;font-size:11px;color:#9fe;background:rgba(0,0,0,.45);padding:10px;border-radius:10px;margin:8px 0 0"></pre>
<button onclick="doLogin()">LOGIN</button>

<div class="link">
Belum punya akun?
<a onclick="registerPage()">Daftar</a>
</div>
</div>


<div id="register" class="hide">
<h2 class="page-title">Buat Akun</h2>

<div class="field">
<label>Email</label>
<input id="reg-email" type="email" placeholder="email@gmail.com" autocomplete="email">
</div>

<div class="field">
<label>Password</label>
<input id="reg-pass" type="password" placeholder="Password (min. 6 karakter)" autocomplete="new-password">
</div>

<button onclick="doRegister()">DAFTAR</button>

<div class="link">
Sudah punya akun?
<a onclick="loginPage()">Login</a>
</div>
</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js?v=8"></script>
<script src="../js/auth.js?v=8"></script>
<script src="../js/password-toggle.js?v=1"></script>
<script>
const login=document.getElementById("login");
const register=document.getElementById("register");

function loginPage(){
login.classList.remove("hide");
register.classList.add("hide");
}

function registerPage(){
login.classList.add("hide");
register.classList.remove("hide");
}

const $ = (id) => document.getElementById(id);
const say = (t) => { $("auth-msg").textContent = t || ""; };
// Mode debug: buka halaman ini dengan ?debug=1 untuk melihat error Supabase asli + diagnosa koneksi.
const dbg = (o) => { if(!MalikAuth.debug) return; const el = $("auth-debug"); el.classList.remove("hide"); el.textContent = typeof o === "string" ? o : JSON.stringify(o, null, 2); };
let busy = false;

// Setelah login: lanjut ke order (paket yang tadi dipilih dibawa serta), atau ke dashboard.
function afterLogin(){
  const pending = MalikAuth.takePending();
  location.href = pending ? MalikAuth.orderUrl(pending) : "dashboard/index.html";
}

async function doLogin(){
  if(busy) return; busy = true; say("");
  const r = await MalikAuth.login($("login-email").value, $("login-pass").value);
  busy = false;
  if(r.ok){ afterLogin(); return; }
  say(r.message);
  if(MalikAuth.debug) dbg({ supabaseError: r.raw, diagnosa: await MalikAuth.diagnose() });
}

// Register: Supabase Auth -> profil dibuat otomatis di tabel profiles (trigger database).
async function doRegister(){
  if(busy) return;
  const email = $("reg-email").value.trim(), pass = $("reg-pass").value;
  if(!/^\S+@\S+\.\S+$/.test(email)) return alert("Email tidak valid.");
  if(pass.length < 6) return alert("Password minimal 6 karakter.");
  busy = true;
  const r = await MalikAuth.register(email, pass);
  busy = false;
  if(!r.ok){ alert(r.message); if(MalikAuth.debug) dbg({ supabaseError: r.raw }); return; }
  if(r.needsConfirm){
    alert("Pendaftaran berhasil. Cek email kamu untuk konfirmasi, lalu login.");
    $("login-email").value = email; loginPage(); return;
  }
  afterLogin();
}

// Sudah punya sesi aktif? Jangan tampilkan form login, langsung ke dashboard (atau lanjut order).
// Form disembunyikan dulu selama pengecekan supaya tidak berkedip.
(function(){
  const box = $("auth-box");
  const show = () => box.classList.remove("checking");
  const t = setTimeout(show, 2500);   // jaga-jaga jika jaringan lambat
  MalikAuth.hasSession().then(function(ok){
    clearTimeout(t);
    if(ok) afterLogin(); else show();
  }).catch(function(){ clearTimeout(t); show(); });
})();
if(MalikAuth.debug) MalikAuth.diagnose().then(dbg);
</script>

</body>
</html>
