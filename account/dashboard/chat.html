<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Admin - Malik Store</title>
<style>
@font-face{font-family:Malik;src:url("../../assets/font/font.ttf")}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#050a14;color:#fff;font-family:Malik,Arial,sans-serif}
.h{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #1c2a44;background:#0a1324}
.h a{color:#00d9ff;text-decoration:none;font-size:22px}.h b{display:block}.h small{color:#8b9ab4}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.m small{display:block;margin-top:4px;font-size:10px;opacity:.65;text-align:right}
.m.user{align-self:flex-end;background:linear-gradient(90deg,#00ff66,#00d9ff);color:#031008}
.m.admin{align-self:flex-start;background:#111c32;border:1px solid #1c2a44}
.e{margin:auto;color:#8b9ab4;text-align:center}
.s{display:flex;gap:10px;padding:12px;border-top:1px solid #1c2a44;background:#0a1324}
.s input{flex:1;min-width:0;padding:13px;border-radius:12px;border:1px solid #1c2a44;background:#050a14;color:#fff;font:inherit;outline:none}
.s input:focus{border-color:#00ff66}
.s button{padding:0 20px;border:0;border-radius:12px;font-weight:bold;cursor:pointer;background:linear-gradient(90deg,#00ff66,#00d9ff);color:#000}
</style>
</head>
<body>
<div class="h"><a href="index.html">&larr;</a><div><b>Chat Admin</b><small id="who"></small></div></div>
<div id="msgs"></div>
<div class="s"><input id="mi" maxlength="500" placeholder="Tulis pesan..." autocomplete="off"><button id="sb">KIRIM</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js?v=6"></script>
<script src="../../js/auth.js?v=6"></script>
<script src="../../js/notify.js?v=2" defer></script>
<script>
// Chat private per user: tabel messages (user_id = pemilik percakapan), realtime via Supabase.
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me = null, msgs = [], last = "";

function draw(force){
  const html = msgs.length ? msgs.map(m => '<div class="m ' + (m.sender === "admin" ? "admin" : "user") + '">' + esc(m.message) +
    '<small>' + new Date(m.created_at).toLocaleTimeString("id-ID", {hour: "2-digit", minute: "2-digit"}) + '</small></div>').join("")
    : '<div class="e">Belum ada pesan.<br>Tulis pesan pertama ke admin.</div>';
  if(html === last && !force) return;
  last = html; $("msgs").innerHTML = html; $("msgs").scrollTop = $("msgs").scrollHeight;
}
function add(m){
  if(msgs.some(x => x.id === m.id)) return;
  msgs.push(m); msgs.sort((a, b) => new Date(a.created_at) - new Date(b.created_at)); draw(true);
}
async function send(){
  const text = $("mi").value.trim().slice(0, 500);
  if(!text || !me) return;
  $("mi").value = "";
  const r = await supabaseClient.from("messages").insert({ user_id: me.id, sender: "user", message: text }).select().single();
  if(r.error){ $("mi").value = text; alert("Pesan gagal terkirim: " + r.error.message); return; }
  add(r.data);
}
async function init(){
  me = await MalikAuth.requireLogin(); if(!me) return;
  $("who").textContent = me.email;
  const r = await supabaseClient.from("messages").select("*").eq("user_id", me.id).order("created_at", { ascending: true }).limit(300);
  msgs = r.data || []; draw(true);
  supabaseClient.channel("chat-" + me.id)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "user_id=eq." + me.id }, p => add(p.new))
    .subscribe();
}
$("sb").onclick = send;
$("mi").addEventListener("keydown", e => { if(e.key === "Enter") send(); });
init();
</script>
</body>
</html>
