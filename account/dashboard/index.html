<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Malik Store Dashboard</title>
<style>
body{margin:0;background:#050505;color:white;font-family:Arial;padding:20px}
.card{max-width:420px;margin:40px auto;background:#111;border:2px solid #00ff66;padding:25px;border-radius:15px}
h1 span{color:#00ff66}.btn{display:block;background:#00ff66;color:#000;text-decoration:none;padding:15px;margin:15px 0;text-align:center;border-radius:10px;font-weight:bold}
</style></head>
<body><div class="card">
<h1>MALIK<span>STORE</span></h1>
<p>Dashboard User</p>
<h2>Halo, <span id="uname" style="color:inherit">User</span> 👋</h2>
<a class="btn" href="order.html" onclick="return checkOrderAccess(event)">ORDER PANEL</a>
<a class="btn" href="#">RIWAYAT ORDER</a>
<a class="btn" href="chat.html">CHAT ADMIN</a>
<a class="btn" href="../" onclick="return doLogout(event)">LOGOUT</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js?v=7"></script>
<script src="../../js/auth.js?v=7"></script>
<script src="../../js/notify.js?v=2" defer></script>
<script>
// Halaman ini hanya untuk user yang sudah login (sesi Supabase).
(async function(){
  const u = await MalikAuth.requireLogin(); if(!u) return;
  window.__malikOk = true;
  const p = await MalikAuth.profile();
  document.getElementById("uname").textContent = (p && p.username) || (u.email || "").split("@")[0] || "User";
})();
function checkOrderAccess(e){
  if(window.__malikOk) return true;
  e.preventDefault(); location.href = MalikAuth.pages.account; return false;
}
async function doLogout(e){
  e.preventDefault(); await MalikAuth.logout(); location.href = MalikAuth.pages.account; return false;
}
</script>
</body></html>
