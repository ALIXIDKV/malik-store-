<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Malik Store Dashboard</title>
<script src="../../js/role.js"></script>
<style>
@font-face{font-family:Malik;src:url("../../assets/font/font.ttf")}
:root{--g:#00ff66;--c:#00d9ff;--bg:#050a14;--card:#0d1627;--card2:#111c32;--line:#1c2a44;--mut:#8b9ab4;--warn:#ffb020;--bad:#ff5c6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;color:#fff;font-family:Malik,Arial,sans-serif;padding-bottom:calc(24px + var(--mk-nav-h,0px));
background:radial-gradient(700px 420px at 0 -10%,rgba(0,255,102,.10),transparent 60%),radial-gradient(700px 420px at 100% 0,rgba(0,217,255,.10),transparent 60%),var(--bg);background-attachment:fixed}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;background:rgba(5,10,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-size:18px;font-weight:bold;letter-spacing:2px}.logo span{color:var(--g)}
.ttl{font-size:13px;color:var(--mut)}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 8px}
.tab{display:none}.tab.on{display:block}
h3{margin:22px 0 10px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--c)}
h3:first-child{margin-top:4px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(0,255,102,.12),rgba(0,217,255,.10));border:1px solid rgba(0,255,200,.28)}
.st small{display:block;color:var(--mut);font-size:12px}.st b{display:block;margin-top:4px;font-size:26px;color:var(--g)}
.row{display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.chipx{width:46px;height:46px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;color:var(--g);background:rgba(0,255,102,.10);border:1px solid rgba(0,255,102,.35)}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx small{display:block;margin-top:3px;color:var(--mut);font-size:12px}.row .tx small i{font-style:normal;color:var(--g)}
.go{flex:none;padding:9px 16px;border:0;border-radius:10px;font:inherit;font-weight:bold;font-size:13px;cursor:pointer;color:#031008;background:linear-gradient(90deg,var(--g),var(--c))}
.oc{padding:14px;margin-bottom:10px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.oc .a{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.oc .a b{font-size:14px}
.oc .b{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--mut)}.oc .b i{font-style:normal;color:var(--g);font-weight:bold;font-size:14px}
.pill{flex:none;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:bold;border:1px solid}
.p-pending{color:var(--warn);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.08)}
.p-diproses{color:var(--c);border-color:rgba(0,217,255,.4);background:rgba(0,217,255,.08)}
.p-selesai{color:var(--g);border-color:rgba(0,255,102,.4);background:rgba(0,255,102,.08)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}.empty .go{margin-top:14px}
.me{text-align:center;padding:26px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.av{width:78px;height:78px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;text-transform:uppercase;color:#031008;background:linear-gradient(135deg,var(--g),var(--c));box-shadow:0 0 26px rgba(0,255,150,.3)}
.me b{display:block;font-size:18px}.me small{display:block;margin-top:4px;color:var(--mut);word-break:break-all}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;padding:14px;border-radius:14px;font:inherit;font-weight:bold;font-size:14px;text-decoration:none;cursor:pointer}
.btn.n{color:var(--g);background:rgba(0,255,102,.08);border:1px solid rgba(0,255,102,.45)}
.btn.o{color:var(--bad);background:rgba(255,92,108,.08);border:1px solid rgba(255,92,108,.45)}
.rv{display:inline-block;margin-top:10px;padding:8px 14px;border:1px solid rgba(0,255,102,.45);border-radius:10px;background:rgba(0,255,102,.08);color:var(--g);font:inherit;font-weight:bold;font-size:12px;cursor:pointer}
.rv.done{border-color:var(--line);background:none;color:var(--mut);cursor:default}
</style><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../css/shared.css?v=2">
</head>
<body>
<div class="top"><span class="logo">MALIK<span>STORE</span></span><span class="ttl" id="ttl">Riwayat</span></div>
<div class="wrap">
  <section class="tab on" id="t-hist">
    <div class="sum"><div class="st"><small>Total Order</small><b id="n-all">0</b></div><div class="st"><small>Sedang Berjalan</small><b id="n-run">0</b></div></div>
    <h3>Riwayat Order</h3>
    <div id="olist"><div class="empty">Memuat...</div></div>
  </section>
  <section class="tab" id="t-prof">
    <div class="me"><div class="av-wrap"><div class="av" id="av">U</div><button type="button" class="av-edit" id="pf-cam" aria-label="Ganti foto profil"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button></div><b id="pn">User</b><small id="pe"></small></div>
    <form class="pf" id="pform" novalidate onsubmit="return saveProfile(event)">
      <h3>Edit Profil</h3>
      <label for="pname">Nama</label>
      <input id="pname" type="text" maxlength="40" placeholder="Nama kamu" autocomplete="nickname">
      <label>Foto Profil <em>(opsional)</em></label>
      <input id="pfile" type="file" accept="image/*" hidden>
      <div class="pf-row"><button type="button" class="btn n" id="pf-pick">Pilih Foto</button><button type="button" class="btn ghost" id="pf-del" hidden>Hapus Foto</button></div>
      <p class="hint">Foto otomatis dipotong persegi &amp; dikecilkan.</p>
      <div class="msg" id="pmsg" role="status"></div>
      <button class="btn" id="pf-save" type="submit">Simpan Perubahan</button>
    </form>
    <a class="btn n" id="chatBtn" href="chat.html?v=9"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Chat Admin</a>
    <a class="btn n" id="adminBtn" href="/admin/dashboard.html" style="display:none"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Panel Admin</a>
    <a class="btn o" href="../" onclick="return doLogout(event)"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</a>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js?v=9"></script>
<script src="../../js/products.js?v=2"></script>
<script src="../../js/auth.js?v=13"></script>
<script src="../../js/reviews.js?v=1"></script>
<script src="../../js/nav.js?v=1"></script>
<script src="../../js/notify.js?v=4" defer></script>
<script>
// Halaman ini hanya untuk user yang sudah login (sesi Supabase).
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp = n => "Rp" + (Number(n) || 0).toLocaleString("id-ID");
const TITLES = { hist: "Riwayat", prof: "Profil" };
let orders = [], reviewed = {};

// Tab mengikuti hash (#hist / #prof) yang diatur bottom nav global (js/nav.js). Tanpa hash = Riwayat.
function show(t){
  if(!TITLES[t]) t = "hist";
  document.querySelectorAll(".tab").forEach(s => s.classList.toggle("on", s.id === "t-" + t));
  $("ttl").textContent = TITLES[t]; window.scrollTo(0, 0);
}
window.addEventListener("hashchange", () => show(location.hash.slice(1)));

function drawOrders(){
  $("n-all").textContent = orders.length;
  $("n-run").textContent = orders.filter(o => o.status !== "Selesai").length;
  $("olist").innerHTML = orders.length ? orders.map(o => {
    const m = String(o.product || "").match(/^(.*?)\s+x(\d+)$/i), st = ["Pending","Diproses","Selesai"].includes(o.status) ? o.status : "Pending";
    const qty = o.qty || (m ? Number(m[2]) : 1), unit = o.unit_price || Math.round((Number(o.price) || 0) / qty);
    const key = o.product_key || ((window.MalikProducts && (MalikProducts.fromName(o.product) || {}).key) || "");
    const rv = st === "Selesai" && key ? (reviewed[o.id] ? '<br><span class="rv done">Ulasan kamu ' + MalikReviews.stars(reviewed[o.id]) + '</span>' : '<br><button class="rv" data-rv="' + esc(key) + '" data-oid="' + esc(o.id) + '">Beri Ulasan</button>') : "";
    return '<div class="oc"><div class="a"><b>' + esc(m ? m[1] : o.product) + '</b><span class="pill p-' + st.toLowerCase() + '">' + st + '</span></div>' +
      '<div class="b"><span>' + esc(MalikAuth.orderCode(o.id)) + ' • ' + qty + ' × ' + rp(unit) + '<br>' +
      new Date(o.created_at).toLocaleString("id-ID", {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}) + rv + '</span><i>' + rp(o.price) + '</i></div></div>';
  }).join("") : '<div class="empty">Belum ada riwayat order.<br><a class="go" href="../../index.html#harga-panel" style="display:inline-block;text-decoration:none">Lihat Produk</a></div>';
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-rv]"); if(b && window.MalikReviews) MalikReviews.open(b.dataset.rv, { orderId: b.dataset.oid, onClose: () => loadOrders(me.id) });
});
async function loadOrders(uid){
  const r = await supabaseClient.from("orders").select("*").eq("user_id", uid).order("created_at", { ascending: false });
  orders = r.data || [];
  try {   // order mana yang sudah diulas (tabel reviews; abaikan jika migration belum dijalankan)
    const rr = await supabaseClient.from("reviews").select("order_id,rating").eq("user_id", uid);
    reviewed = {}; (rr.data || []).forEach(x => { reviewed[x.order_id] = x.rating; });
  } catch(e) { reviewed = {}; }
  drawOrders();
}
async function doLogout(e){
  e.preventDefault(); await MalikAuth.logout(); location.href = MalikAuth.pages.account; return false;
}

// ---------- Profil: nama + foto opsional (tabel profiles: username, avatar_url) ----------
let avVal = "", avDirty = false, saving = false;
const okAv = u => typeof u === "string" && (u.indexOf("data:image/") === 0 || u.indexOf("https://") === 0);
function paintAv(name, url){
  const a = $("av"); a.innerHTML = okAv(url) ? '<img alt="" src="' + esc(url) + '">' : esc((name || "U")[0] || "U");
  $("pf-del").hidden = !okAv(url);
}
function pnote(t, type){ const el = $("pmsg"); el.textContent = t || ""; el.className = "msg " + (type || "err"); }
function toAvatar(file){
  return new Promise((ok, no) => {
    if(!/^image\//.test(file.type)) return no(new Error("File harus berupa gambar."));
    if(file.size > 8 * 1024 * 1024) return no(new Error("Ukuran foto maksimal 8 MB."));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 256, c = document.createElement("canvas"), m = Math.min(img.width, img.height);
      c.width = c.height = S;
      c.getContext("2d").drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error("Foto tidak bisa dibaca.")); };
    img.src = url;
  });
}
$("pf-pick").onclick = $("pf-cam").onclick = () => $("pfile").click();
$("pfile").onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if(!f) return;
  try { avVal = await toAvatar(f); avDirty = true; paintAv($("pname").value.trim() || $("pn").textContent, avVal); pnote("Foto dipilih. Tekan Simpan Perubahan.", "ok"); }
  catch(err){ pnote(err.message); }
};
$("pf-del").onclick = () => { avVal = ""; avDirty = true; paintAv($("pname").value.trim() || $("pn").textContent, ""); pnote("Foto dihapus. Tekan Simpan Perubahan.", "ok"); };
$("pname").addEventListener("input", () => { if(!okAv(avVal)) $("av").textContent = ($("pname").value.trim()[0] || "U"); });
async function saveProfile(e){
  e.preventDefault(); if(saving || !me) return false;
  const name = $("pname").value.trim().replace(/\s+/g, " ");
  if(name.length < 2 || name.length > 40){ pnote("Nama harus 2-40 karakter."); return false; }
  const patch = { username: name }; if(avDirty) patch.avatar_url = okAv(avVal) ? avVal : null;
  saving = true; pnote(""); const b = $("pf-save"); b.disabled = true; b.textContent = "Menyimpan...";
  const r = await supabaseClient.from("profiles").update(patch).eq("id", me.id).select("username,avatar_url").maybeSingle();
  saving = false; b.disabled = false; b.textContent = "Simpan Perubahan";
  if(r.error || !r.data){ pnote("Gagal menyimpan" + (r.error ? ": " + r.error.message : ". Pastikan SQL profil sudah dijalankan di Supabase.")); return false; }
  avDirty = false; await MalikAuth.profile(true);
  $("pn").textContent = r.data.username; $("pname").value = r.data.username; avVal = r.data.avatar_url || ""; paintAv(r.data.username, avVal);
  pnote("Profil berhasil disimpan.", "ok"); return false;
}

let me = null;
(async function(){
  const u = await MalikAuth.requireLogin(); if(!u) return;
  me = u;
  const p = await MalikAuth.profile();
  // Admin memakai sesi yang sama: boleh melihat website user, dan mendapat tombol ke Panel Admin (tanpa login ulang).
  if (p && p.role === "admin") { $("chatBtn").style.display = "none"; $("adminBtn").style.display = "flex"; }
  const name = String((p && p.username) || "").trim() || u.email || "User";
  $("pn").textContent = name; $("pe").textContent = u.email || ""; $("pname").value = name; avVal = (p && p.avatar_url) || ""; paintAv(name, avVal);
  show(location.hash.slice(1));
  loadOrders(u.id);
  supabaseClient.channel("dash-orders-" + u.id)
    .on("postgres_changes", { event: "*", schema: "public", table: "orders", filter: "user_id=eq." + u.id }, () => loadOrders(u.id))
    .subscribe();
})();
</script>
</body></html>
