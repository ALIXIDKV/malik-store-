<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Chat - Malik Admin</title>
<link rel="stylesheet" href="assets/admin.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js?v=9"></script>
<script src="js/notify.js?v=3" data-role="admin" defer></script>
</head>
<body>
<script src="js/admin.js?v=11"></script>
<script>
Admin.mount("chat", "Chat User", function (v) {
  var A = Admin, e = A.esc, cur = new URLSearchParams(location.search).get("u") || "", q = "", built = "", sel = {};
  var EMPTY = "<div class='ch-empty'>Pilih user untuk membuka chat.<br><small>Setiap chat bersifat private per user.</small></div>";
  v.innerHTML = "<div class='chat' id='chat'><section class='clist'><div class='ch-h'><input id='cs' type='search' placeholder='Cari user...'></div><div id='cl'></div></section>" +
    "<section class='cth' id='cth'>" + EMPTY + "</section></div>";
  var chat = v.querySelector("#chat"), cl = v.querySelector("#cl"), cth = v.querySelector("#cth");

  function find(em) { return A.threads().filter(function (t) { return t.email === em; })[0]; }
  function selIds() { return Object.keys(sel); }

  function drawList() {
    var list = A.threads().filter(function (t) { return t.email.toLowerCase().indexOf(q) > -1; });
    A.setHTML(cl, list.length ? list.map(function (t) {
      return "<div class='li " + (t.email === cur ? "on" : "") + "' data-e='" + e(t.email) + "'><span class='av " + (t.online ? "on" : "") + "'>" + e(t.email[0]) + "</span>" +
        "<span class='tx'><b>" + e(t.email) + "</b><small>" + e(t.last ? t.last.text : "") + "</small></span>" +
        (t.unread ? "<span class='n'>" + t.unread + "</span>" : "") + "</div>";
    }).join("") : "<div class='empty'>Belum ada chat.<br><small>User mengirim pesan lewat Dashboard User &gt; Chat Admin.</small></div>");
  }

  function updateBar() {
    var n = selIds().length, c = cth.querySelector("#sc");
    cth.classList.toggle("selmode", n > 0);
    if (c) c.textContent = n + " dipilih";
  }

  function drawMsgs(forceScroll, keep) {
    var t = find(cur), box = cth.querySelector("#msgs");
    if (!box) return;
    if (!t) { A.setHTML(box, "<div class='ch-empty'>Belum ada pesan.</div>"); sel = {}; updateBar(); return; }
    if (t.unread) A.markSeen(cur);
    // buang pilihan untuk pesan yang sudah terhapus (mis. dihapus dari perangkat lain)
    selIds().forEach(function (id) { if (!t.msgs.some(function (m) { return String(m.id) === id; })) delete sel[id]; });
    var near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    var html = t.msgs.map(function (m) {
      var id = String(m.id);
      return "<div class='m " + (m.from === "admin" ? "admin" : "user") + (sel[id] ? " sel" : "") + "' data-id='" + e(id) + "'>" + e(m.text) + "<small>" + A.fmt(m.at) + "</small></div>";
    }).join("") || "<div class='ch-empty'>Belum ada pesan.</div>";
    var changed = box.__h !== html;
    A.setHTML(box, html);
    var st = cth.querySelector("#tst"); if (st) st.textContent = t.online ? "Online" : "Offline";
    if (!keep && (forceScroll || (changed && near))) box.scrollTop = box.scrollHeight;
    updateBar();
  }

  function toggle(id, on) {
    if (String(id).indexOf("tmp-") === 0) return;   // pesan yang belum tersimpan tidak bisa dipilih
    if (on === true) sel[id] = 1; else if (sel[id]) delete sel[id]; else sel[id] = 1;
    drawMsgs(false, true);
  }

  function closeThread() {
    chat.classList.remove("open"); document.body.classList.remove("chat-open");
    cur = ""; built = ""; sel = {}; cth.classList.remove("selmode"); cth.innerHTML = EMPTY; drawList();
  }

  async function delSelected() {
    var ids = selIds(); if (!ids.length) return;
    var pick = await A.dialog({
      title: "Hapus " + ids.length + " pesan?",
      text: "Hanya pesan yang dihapus. Akun user tidak ikut terhapus.",
      actions: [
        { label: "Hapus untuk saya", value: "me" },
        { label: "Hapus untuk semua orang", value: "all", kind: "danger" },
        { label: "Batal", value: null }
      ]
    });
    if (!pick) return;
    var r = await A.deleteMessages(ids, pick);
    if (!r.ok) { A.alertBox("Gagal menghapus pesan", r.message); return; }
    sel = {}; drawMsgs(false, true); drawList();
  }

  async function delChat() {
    if (!(await A.confirmBox("Hapus seluruh chat?", "Semua pesan dengan " + cur + " akan dihapus untuk semua orang. Akun user TIDAK ikut terhapus.", "Hapus Chat"))) return;
    var r = await A.deleteChat(cur);
    if (!r.ok) { A.alertBox("Gagal menghapus chat", r.message); return; }
    sel = {}; drawMsgs(true); drawList();
  }

  function openThread(em) {
    cur = em; built = em; sel = {}; chat.classList.add("open"); document.body.classList.add("chat-open");
    var t = find(em);
    cth.innerHTML = "<div class='th-h'>" +
      "<div class='th-n'><button class='btn ghost sm x' id='bk' aria-label='Tutup chat' title='Tutup'>" + A.icon("close") + "</button>" +
      "<span class='av'>" + e(em[0]) + "</span><div class='th-t'><b>" + e(em) + "</b><small id='tst'>" + (t && t.online ? "Online" : "Offline") + "</small></div>" +
      "<button class='btn ghost sm dz' id='dc'>" + A.icon("trash") + "<span>Hapus Chat</span></button></div>" +
      "<div class='th-s'><button class='btn ghost sm x' id='sx' aria-label='Batal pilih' title='Batal'>" + A.icon("close") + "</button><b id='sc'>0 dipilih</b>" +
      "<button class='btn ghost sm dz' id='sd' aria-label='Hapus pesan' title='Hapus'>" + A.icon("trash") + "</button></div></div>" +
      "<div id='msgs'></div><div class='snd'><input id='mi' type='text' maxlength='1000' placeholder='Tulis balasan...' autocomplete='off'><button class='btn' id='sb'>" + A.icon("send") + "</button></div>";
    var mi = cth.querySelector("#mi"), box = cth.querySelector("#msgs");
    function send() { if (A.sendAdmin(cur, mi.value)) { mi.value = ""; drawMsgs(true); drawList(); } }
    cth.querySelector("#sb").onclick = send;
    mi.addEventListener("keydown", function (ev) { if (ev.key === "Enter") send(); });
    cth.querySelector("#bk").onclick = closeThread;
    cth.querySelector("#dc").onclick = delChat;
    cth.querySelector("#sx").onclick = function () { sel = {}; drawMsgs(false, true); };
    cth.querySelector("#sd").onclick = delSelected;

    // tekan lama bubble = pilih pesan (seperti WhatsApp); setelah ada yang dipilih, ketuk bubble lain untuk menambah/membatalkan
    var timer = null, sx = 0, sy = 0, fired = false;
    function bub(ev) { return ev.target.closest ? ev.target.closest(".m[data-id]") : null; }
    box.addEventListener("pointerdown", function (ev) {
      var b = bub(ev); if (!b || (ev.pointerType === "mouse" && ev.button !== 0)) return;
      fired = false; sx = ev.clientX; sy = ev.clientY; clearTimeout(timer);
      timer = setTimeout(function () { fired = true; toggle(b.getAttribute("data-id"), true); }, 450);
    });
    box.addEventListener("pointermove", function (ev) { if (Math.abs(ev.clientX - sx) > 10 || Math.abs(ev.clientY - sy) > 10) clearTimeout(timer); });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (n) { box.addEventListener(n, function () { clearTimeout(timer); }); });
    box.addEventListener("click", function (ev) {
      var b = bub(ev); if (!b) return;
      if (fired) { fired = false; return; }
      if (selIds().length) toggle(b.getAttribute("data-id"));
    });
    box.addEventListener("contextmenu", function (ev) {
      var b = bub(ev); if (!b) return;
      ev.preventDefault(); if (!sel[b.getAttribute("data-id")]) toggle(b.getAttribute("data-id"), true);
    });
    drawMsgs(true); drawList();
  }

  cl.addEventListener("click", function (ev) { var r = ev.target.closest("[data-e]"); if (r) openThread(r.getAttribute("data-e")); });
  v.querySelector("#cs").addEventListener("input", function (ev) { q = ev.target.value.trim().toLowerCase(); drawList(); });

  drawList();
  if (cur && find(cur)) openThread(cur); else cur = "";
  A.onTick(function () { drawList(); if (built) drawMsgs(false); });
});
</script>
</body>
</html>
