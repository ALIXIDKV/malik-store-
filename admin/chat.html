<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Chat - Malik Admin</title>
<link rel="stylesheet" href="assets/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.MALIK_SB_STORAGE_KEY = "malik-admin-auth";</script>
<script src="../js/supabase.js?v=8"></script>
<script src="js/notify.js?v=2" data-role="admin" defer></script>
</head>
<body>
<script src="js/admin.js?v=8"></script>
<script>
Admin.mount("chat", "Chat User", function (v) {
  var A = Admin, e = A.esc, cur = new URLSearchParams(location.search).get("u") || "", q = "", built = "";
  v.innerHTML = "<div class='chat' id='chat'><section class='clist'><div class='ch-h'><input id='cs' type='search' placeholder='Cari user...'></div><div id='cl'></div></section>" +
    "<section class='cth' id='cth'><div class='ch-empty'>Pilih user untuk membuka chat.<br><small>Setiap chat bersifat private per user.</small></div></section></div>";
  var chat = v.querySelector("#chat"), cl = v.querySelector("#cl"), cth = v.querySelector("#cth");

  function find(em) { return A.threads().filter(function (t) { return t.email === em; })[0]; }

  function drawList() {
    var list = A.threads().filter(function (t) { return t.email.toLowerCase().indexOf(q) > -1; });
    A.setHTML(cl, list.length ? list.map(function (t) {
      return "<div class='li " + (t.email === cur ? "on" : "") + "' data-e='" + e(t.email) + "'><span class='av " + (t.online ? "on" : "") + "'>" + e(t.email[0]) + "</span>" +
        "<span class='tx'><b>" + e(t.email) + "</b><small>" + e(t.last ? t.last.text : "") + "</small></span>" +
        (t.unread ? "<span class='n'>" + t.unread + "</span>" : "") + "</div>";
    }).join("") : "<div class='empty'>Belum ada chat.<br><small>User mengirim pesan lewat Dashboard User &gt; Chat Admin.</small></div>");
  }

  function drawMsgs(forceScroll) {
    var t = find(cur), box = cth.querySelector("#msgs");
    if (!t || !box) return;
    if (t.unread) A.markSeen(cur);
    var near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    var html = t.msgs.map(function (m) {
      return "<div class='m " + (m.from === "admin" ? "admin" : "user") + "'>" + e(m.text) + "<small>" + A.fmt(m.at) + "</small></div>";
    }).join("") || "<div class='ch-empty'>Belum ada pesan.</div>";
    var changed = box.__h !== html;
    A.setHTML(box, html);
    var st = cth.querySelector("#tst"); if (st) st.textContent = t.online ? "Online" : "Offline";
    if (forceScroll || (changed && near)) box.scrollTop = box.scrollHeight;
  }

  function openThread(em) {
    cur = em; built = em; chat.classList.add("open");
    var t = find(em);
    cth.innerHTML = "<div class='th-h'><button class='btn ghost sm back' id='bk'>" + A.icon("back") + "</button>" +
      "<span class='av'>" + e(em[0]) + "</span><div><b>" + e(em) + "</b><small id='tst'>" + (t && t.online ? "Online" : "Offline") + "</small></div></div>" +
      "<div id='msgs'></div><div class='snd'><input id='mi' type='text' maxlength='1000' placeholder='Tulis balasan...' autocomplete='off'><button class='btn' id='sb'>" + A.icon("send") + "</button></div>";
    var mi = cth.querySelector("#mi");
    function send() { if (A.sendAdmin(cur, mi.value)) { mi.value = ""; drawMsgs(true); drawList(); } }
    cth.querySelector("#sb").onclick = send;
    mi.addEventListener("keydown", function (ev) { if (ev.key === "Enter") send(); });
    cth.querySelector("#bk").onclick = function () { chat.classList.remove("open"); cur = ""; built = ""; drawList(); };
    drawMsgs(true); drawList();
  }

  cl.addEventListener("click", function (ev) { var r = ev.target.closest("[data-e]"); if (r) openThread(r.getAttribute("data-e")); });
  v.querySelector("#cs").addEventListener("input", function (ev) { q = ev.target.value.trim().toLowerCase(); drawList(); });

  drawList();
  if (cur && find(cur)) openThread(cur); else cur = "";
  A.onTick(function () { drawList(); if (built) drawMsgs(false); });
});
</script>
</body>
</html>
