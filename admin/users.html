<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Users - Malik Admin</title>
<link rel="stylesheet" href="assets/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.MALIK_SB_STORAGE_KEY = "malik-admin-auth";</script>
<script src="../js/supabase.js?v=7"></script>
<script src="js/notify.js?v=2" data-role="admin" defer></script>
</head>
<body>
<script src="js/admin.js?v=7"></script>
<script>
Admin.mount("users", "Users", function (v) {
  var A = Admin, e = A.esc, q = "", open = "";
  v.innerHTML = "<div class='bar'><div><b id='cnt'></b> <span class='hint'>user terdaftar</span></div><input class='s' id='q' type='search' placeholder='Cari email...'></div><div id='tw'></div>";
  var tw = v.querySelector("#tw"), cnt = v.querySelector("#cnt");
  function draw() {
    var all = A.users(), list = all.filter(function (u) { return u.email.toLowerCase().indexOf(q) > -1; });
    cnt.textContent = "Total " + all.length;
    var rows = list.map(function (u) {
      var isOpen = open === u.email;
      var r = "<tr><td><b>" + e(u.email) + "</b>" + "<br><small class='mut'>" + e(u.username) + "</small></td>" +
        "<td><span class='pill " + (u.online ? "p-on" : "p-off") + "'>" + (u.online ? "Online" : "Offline") + "</span></td>" +
        "<td>" + (u.createdAt ? A.fmt(u.createdAt) : "-") + "</td>" +
        "<td>" + u.orders.length + " order<br><small class='g'>" + A.rp(u.total) + "</small></td>" +
        "<td><button class='btn ghost sm' data-u='" + e(u.email) + "'>" + (isOpen ? "Tutup" : "Riwayat") + "</button> " +
        "<a class='btn ghost sm' style='text-decoration:none' href='chat.html?u=" + encodeURIComponent(u.email) + "'>Chat</a></td></tr>";
      if (isOpen) {
        r += "<tr class='sub'><td colspan='5'>" + (u.orders.length ? u.orders.map(function (o) {
          return "<div class='bar' style='padding:6px 0'><span>" + e(o.code) + " &bull; " + e(o.product) + " x" + o.qty + " <span class='mut'>(" + A.fmt(o.createdAt) + ")</span></span><span>" + A.rp(o.price) + " " + A.pill(o.status) + "</span></div>";
        }).join("") : "<span class='mut'>Belum ada riwayat order.</span>") + "</td></tr>";
      }
      return r;
    }).join("") || "<tr><td colspan='5' class='empty'>Tidak ada user.</td></tr>";
    A.setHTML(tw, "<div class='tw'><table><thead><tr><th>Email</th><th>Status Login</th><th>Terdaftar</th><th>Order</th><th>Aksi</th></tr></thead><tbody>" + rows + "</tbody></table></div>");
  }
  v.querySelector("#q").addEventListener("input", function (ev) { q = ev.target.value.trim().toLowerCase(); draw(); });
  tw.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-u]"); if (!b) return;
    open = open === b.getAttribute("data-u") ? "" : b.getAttribute("data-u"); draw();
  });
  draw(); A.onTick(draw);
});
</script>
</body>
</html>
