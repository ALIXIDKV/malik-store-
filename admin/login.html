<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Login Admin - Malik Store</title>
<link rel="stylesheet" href="assets/admin.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js?v=9"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/shared.css?v=3"><script>try{sessionStorage.setItem("malik_loaded","1")}catch(e){}</script>
<meta name="description" content="Login panel admin Malik Store.">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/image/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/assets/image/favicon-192.png"><link rel="apple-touch-icon" href="/assets/image/apple-touch-icon.png">
</head>
<body class="login-body">
<div class="lbox">
  <div class="brand">MALIK<span>STORE</span><small>ADMIN PANEL</small></div>
  <h2>MASUK ADMIN</h2>
  <div class="fld"><label for="id">Email</label><input id="id" type="email" autocomplete="username" placeholder="Email admin" style="width:100%"></div>
  <div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password" style="width:100%"></div>
  <p class="err" id="err" role="alert"></p>
  <button class="btn" id="go" type="button">LOGIN</button>
</div>
<script src="js/admin.js?v=15"></script>
<script src="../js/password-toggle.js?v=1"></script>
<script>
// Sesi SAMA dengan website user: admin langsung ke dashboard, user biasa dialihkan ke website user, guest tetap di sini.
Admin.route().then(function (to) { if (to !== "/admin/login.html") location.replace(to); }, function () {});
var $ = function (i) { return document.getElementById(i); };
async function go() {
  $("go").disabled = true; $("err").textContent = "";
  var r = await Admin.login($("id").value, $("pw").value);
  if (r.ok) { location.replace("/admin/dashboard.html"); return; }
  $("err").textContent = r.message;
  if (r.notAdmin) { setTimeout(function () { location.replace("/index.html"); }, 1200); return; }   // login berhasil tapi bukan admin: ke website user
  $("go").disabled = false;
}
$("go").onclick = go;
["id", "pw"].forEach(function (i) { $(i).addEventListener("keydown", function (e) { if (e.key === "Enter") go(); }); });
</script>
</body>
</html>
