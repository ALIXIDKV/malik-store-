<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Login Admin - Malik Store</title>
<link rel="stylesheet" href="assets/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>window.MALIK_SB_STORAGE_KEY = "malik-admin-auth";</script>
<script src="../js/supabase.js?v=8"></script>
</head>
<body class="login-body">
<div class="lbox">
  <div class="brand">MALIK<span>STORE</span><small>ADMIN PANEL</small></div>
  <h2>MASUK ADMIN</h2>
  <div class="fld"><label for="id">Email</label><input id="id" type="email" autocomplete="username" placeholder="Email admin" style="width:100%"></div>
  <div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password" style="width:100%"></div>
  <p class="err" id="err" role="alert"></p>
  <button class="btn" id="go" type="button">LOGIN</button>
</div>
<script src="js/admin.js?v=8"></script>
<script src="../js/password-toggle.js?v=1"></script>
<script>
Admin.isLoggedIn().then(function (ok) { if (ok) location.replace("/admin/dashboard.html"); });
var $ = function (i) { return document.getElementById(i); };
async function go() {
  $("go").disabled = true; $("err").textContent = "";
  var r = await Admin.login($("id").value, $("pw").value);
  if (r.ok) { location.replace("/admin/dashboard.html"); return; }
  $("err").textContent = r.message; $("go").disabled = false;
}
$("go").onclick = go;
["id", "pw"].forEach(function (i) { $(i).addEventListener("keydown", function (e) { if (e.key === "Enter") go(); }); });
</script>
</body>
</html>
