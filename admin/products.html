<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="Panel admin Malik Store: kelola produk, harga, dan deskripsi.">
<meta name="theme-color" content="#0a1220">
<title>Produk - Malik Admin</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/image/favicon-32.png"><link rel="apple-touch-icon" href="/assets/image/apple-touch-icon.png">
<link rel="stylesheet" href="assets/admin.css?v=4b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js?v=9"></script>
<script src="../js/products.js?v=2"></script>
<script src="js/notify.js?v=5" data-role="admin" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/shared.css?v=3b"><script>try{sessionStorage.setItem("malik_loaded","1")}catch(e){}</script>
<style>
.pm-info{margin-bottom:16px}.pm-info b{font-size:15px}.pm-info p{margin:6px 0 0;line-height:1.55}
.pm-card{margin-bottom:18px}
.pm-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:12px}.pm-top h3{margin:0}
.pm-f{display:block;margin-bottom:12px}.pm-f>span{display:block;margin:0 0 6px;font-size:12px;color:#c3cddd}
.pm-f input[type=text],.pm-f textarea{width:100%;font-size:16px}.pm-f textarea{resize:vertical;line-height:1.5}
.pm-grp{padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.pm-vars{display:grid;gap:10px}
.pm-row{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(130px,1fr) auto auto;gap:10px 14px;align-items:start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025);transition:border-color .2s,background .2s}
.pm-row .pm-f{margin:0}.pm-row.dirty,.pm-grp.dirty .pm-s{border-color:rgba(251,191,36,.45)}
.pm-row.dirty{background:rgba(251,191,36,.05)}.pm-row.off{opacity:.78}
.pm-p small{display:block;margin-top:5px}.pm-link{padding:0;margin-left:4px;border:0;background:none;color:var(--c);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.pm-s{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}.pm-row .pm-s{margin-top:22px;min-width:120px;flex-direction:column;align-items:stretch}
.pm-grp .pm-s{margin-top:2px}
.pm-msg{font-size:12px;color:var(--mut);min-height:16px}.pm-msg.ok{color:var(--g)}.pm-msg.err{color:var(--bad)}.pm-msg.warn{color:var(--warn)}
.pm-a{margin-top:0}.pm-a>span{margin-bottom:6px}
.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;min-height:44px;font-size:13px}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:relative;width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line);transition:background .2s}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+i{background:var(--g)}.sw input:checked+i:after{transform:translateX(18px);background:#07101f}
.sw input:focus-visible+i{box-shadow:0 0 0 3px rgba(123,167,234,.3)}
.pm-s .dz{white-space:nowrap}
.pm-arch,.pm-archbox{margin-top:14px}.pm-arch>b{display:block;font-size:12px;color:var(--mut);margin-bottom:8px}
.pm-arow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding:10px 14px;margin-bottom:8px;border:1px dashed var(--line);border-radius:12px;opacity:.85}
.pm-arow>span:first-child{flex:1 1 200px;font-size:13px}.pm-arow .pm-msg{flex-basis:100%}
@media(max-width:820px){
  .pm-row{grid-template-columns:1fr 1fr}.pm-row .pm-n{grid-column:1/-1}.pm-row .pm-s{grid-column:1/-1;margin-top:2px;flex-direction:row;align-items:center}
  .pm-row .pm-a{margin-top:0}
}
</style>
</head>
<body>
<script src="js/admin.js?v=15"></script>
<script src="js/products-admin.js?v=2"></script>
<script>
Admin.mount("products", "Produk", function (v) { AdminProducts.mount(v); });
</script>
</body>
</html>
